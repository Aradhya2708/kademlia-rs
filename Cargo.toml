[package]
name = "kademlia"
version = "0.1.0"
edition = "2024"
description = "A Kademlia distributed hash table over UDP, built on tokio"
license = "MIT"
repository = "https://github.com/Aradhya2708/kademlia-rs"
readme = "README.md"
keywords = ["kademlia", "dht", "p2p", "networking"]
categories = ["network-programming"]

[dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
