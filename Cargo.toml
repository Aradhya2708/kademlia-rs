[package]
name = "kademlia"
version = "0.1.0"
edition = "2024"
description = "A Kademlia distributed hash table over UDP, built on tokio"
license = "MIT"
repository = "https://github.com/Aradhya2708/kademlia-rs"
readme = "README.md"
keywords = ["kademlia", "dht", "p2p", "networking"]
categories = ["network-programming"]

[dependencies]
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
